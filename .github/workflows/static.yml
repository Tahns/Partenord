# Publie le site sur GitHub Pages à chaque modification de la branche main
name: Mise en ligne (GitHub Pages)

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/test.js
      - run: node test/test-conciliation.js

  deploy:
    needs: tests
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Préparer les fichiers du site
        run: |
          mkdir _site
          cp -r index.html verrou.js app.js lettre.js conciliation.js conciliation-app.js favicon.svg logo.svg vendor modeles _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
